<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120b20">
  <meta name="description" content="A little love note, made for someone special.">
  <title>Forever Mine ♡</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100b1c;
      --rose: #ff6d96;
      --light-rose: #ffb5c9;
      --cream: #fff4f6;
      --muted: #c5b6c9;
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 28px 18px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(114, 35, 99, .34), transparent 38%),
        radial-gradient(ellipse at 86% 83%, rgba(180, 42, 87, .22), transparent 34%),
        linear-gradient(145deg, #110b1e 0%, #1b0e27 50%, #0f0a1b 100%);
      isolation: isolate;
    }

    /* Gentle texture and ambient light */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .33;
      background-image:
        radial-gradient(1px 1px at 12% 19%, #ffffff 99%, transparent),
        radial-gradient(2px 2px at 77% 15%, #ffbad2 99%, transparent),
        radial-gradient(1px 1px at 49% 67%, #ffffff 99%, transparent),
        radial-gradient(2px 2px at 89% 78%, #ffbad2 99%, transparent),
        radial-gradient(1px 1px at 23% 86%, #ffffff 99%, transparent);
      background-size: 380px 380px;
    }

    .glow {
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(72px);
      pointer-events: none;
      animation: drift 13s ease-in-out infinite alternate;
    }
    .glow.one {
      width: 300px;
      height: 300px;
      top: -110px;
      right: -100px;
      background: rgba(245, 78, 138, .13);
    }
    .glow.two {
      width: 300px;
      height: 300px;
      bottom: -130px;
      left: -100px;
      background: rgba(155, 74, 232, .14);
      animation-delay: -6s;
    }

    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .floating-heart {
      position: absolute;
      bottom: -45px;
      color: #ff739c;
      opacity: 0;
      text-shadow: 0 0 14px rgba(255, 102, 153, .25);
      will-change: transform, opacity;
      animation: floatUp var(--duration) linear forwards;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      padding: clamp(34px, 7vw, 58px) clamp(24px, 6vw, 52px) 42px;
      text-align: center;
      background: linear-gradient(148deg, rgba(255,255,255,.11), rgba(255,255,255,.035) 60%, rgba(255,135,175,.05));
      border: 1px solid rgba(255, 201, 222, .20);
      border-radius: 32px;
      box-shadow:
        0 30px 95px rgba(5, 3, 14, .47),
        inset 0 1px 0 rgba(255,255,255,.13),
        0 0 60px rgba(255, 81, 148, .055);
      animation: enter .85s cubic-bezier(.2,.8,.25,1) both;
      overflow: hidden;
    }
    @supports (backdrop-filter: blur(12px)) {
      .card { backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 16% auto;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,163,196,.9), transparent);
      box-shadow: 0 0 25px rgba(255, 137, 174, .55);
    }
    .card::after {
      content: "✦";
      position: absolute;
      top: 24px;
      right: 28px;
      color: rgba(255, 190, 213, .5);
      font-size: 15px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      line-height: 1;
      letter-spacing: .34em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--light-rose);
      opacity: .87;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 20px;
      height: 1px;
      background: rgba(255,181,201,.5);
    }

    .initials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 100px;
      margin: 27px auto 14px;
    }
    .initial {
      display: inline-grid;
      place-items: center;
      min-width: 64px;
      height: 64px;
      padding: 0 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 199, 220, .22);
      background: rgba(255, 255, 255, .055);
      font: 600 32px/1 Georgia, "Times New Roman", serif;
      color: #ffe3eb;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .initial[hidden] { display: none; }

    .heart-button {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 10px;
      color: var(--rose);
      line-height: 1;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 0 16px rgba(255, 81, 139, .35));
      transition: transform .2s ease, filter .2s ease;
      animation: heartbeat 2.5s ease-in-out infinite;
    }
    .heart-button svg { display: block; width: 56px; height: 56px; }
    .heart-button:hover { filter: drop-shadow(0 0 24px rgba(255, 87, 143, .70)); }
    .heart-button:active { transform: scale(.91); }
    .heart-button:focus-visible { outline: 2px solid var(--light-rose); outline-offset: 4px; }

    h1 {
      margin-top: 8px;
      font: italic 600 clamp(43px, 9vw, 60px)/1.12 Georgia, "Times New Roman", serif;
      letter-spacing: -.045em;
      background: linear-gradient(125deg, #fff6f7 5%, #ffb6ca 60%, #ff779f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      margin: 23px auto 0;
      max-width: 390px;
      color: #f8ecf1;
      font: italic 400 clamp(17px, 3.5vw, 20px)/1.75 Georgia, "Times New Roman", serif;
      text-wrap: balance;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 17px;
      width: min(250px, 86%);
      margin: 29px auto 26px;
      color: var(--light-rose);
      font-size: 14px;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(255,181,201,.55));
    }
    .divider::after { transform: rotate(180deg); }
    .signoff {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      letter-spacing: .02em;
    }
    .infinity {
      display: block;
      margin-top: 20px;
      color: var(--light-rose);
      font: 28px/1 Georgia, serif;
      opacity: .75;
    }
    .burst-heart {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      color: #ff8fb2;
      font-size: 20px;
      animation: burst .95s ease-out forwards;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(24px) scale(.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      17% { transform: scale(1.12); }
      34% { transform: scale(1); }
      49% { transform: scale(1.075); }
      66% { transform: scale(1); }
    }
    @keyframes floatUp {
      0% { transform: translate3d(0,0,0) rotate(-10deg); opacity: 0; }
      12% { opacity: var(--opacity); }
      82% { opacity: var(--opacity); }
      100% { transform: translate3d(var(--sway), -115vh, 0) rotate(30deg); opacity: 0; }
    }
    @keyframes burst {
      from { transform: translate3d(0,0,0) scale(.6); opacity: 1; }
      to { transform: translate3d(var(--dx),var(--dy),0) scale(1.6) rotate(35deg); opacity: 0; }
    }
    @keyframes drift {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(45px,35px,0); }
    }

    @media (max-width: 420px) {
      .card { border-radius: 25px; }
      .initials { gap: 8px; margin-top: 23px; }
      .initial { min-width: 54px; height: 56px; font-size: 27px; border-radius: 17px; }
      .heart-button svg { width: 49px; height: 49px; }
      .card::after { top: 16px; right: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="eyebrow">A note from the heart</div>

    <div class="initials" aria-label="Our initials">
      <span class="initial" id="firstLetter" hidden></span>
      <button class="heart-button" id="loveButton" type="button" aria-label="Send a little love" title="Tap the heart!">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
          <path fill="currentColor" d="M32 55.6 9.5 33.1C-2.4 21.2 15.6 3.3 27.4 15l4.6 4.6 4.6-4.6C48.4 3.3 66.4 21.2 54.5 33.1L32 55.6Z"/>
          <path fill="#ffc2d4" opacity=".45" d="M16.7 16.7c-4.3 1.4-7 5.2-7 9.5 0 1.7.3 2.4.7 3.5-1.1-7.9 5.3-14.4 12.6-13.4-2.4-.7-4.4-.5-6.3.4Z"/>
        </svg>
      </button>
      <span class="initial" id="secondLetter" hidden></span>
    </div>

    <h1>Forever Mine</h1>
    <p class="subtitle">"You are the most beautiful chapter of my life."</p>
    <div class="divider" aria-hidden="true">♥</div>
    <p class="signoff">“One lifetime with you will never be enough.”</p>
    <span class="infinity" aria-hidden="true">∞</span>
  </main>

  <script>
    (() => {
      "use strict";
      // Example: forever_mine_updated.html?h=H&w=D
      const params = new URLSearchParams(window.location.search);
      const setInitial = (id, value) => {
        const element = document.getElementById(id);
        const initial = (value || "").trim().slice(0, 3);
        if (initial) {
          element.textContent = initial; // Safe: no HTML insertion
          element.hidden = false;
        }
      };
      setInitial("firstLetter", params.get("h"));
      setInitial("secondLetter", params.get("w"));

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const heartsContainer = document.getElementById("hearts");
      const loveButton = document.getElementById("loveButton");
      let timer;

      function createHeart() {
        if (heartsContainer.childElementCount >= 16) return;
        const heart = document.createElement("span");
        const duration = 7 + Math.random() * 5;
        heart.className = "floating-heart";
        heart.textContent = Math.random() > .25 ? "♥" : "♡";
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.fontSize = `${12 + Math.random() * 15}px`;
        heart.style.setProperty("--duration", `${duration}s`);
        heart.style.setProperty("--opacity", `${.1 + Math.random() * .22}`);
        heart.style.setProperty("--sway", `${Math.random() * 100 - 50}px`);
        heart.addEventListener("animationend", () => heart.remove(), { once: true });
        heartsContainer.appendChild(heart);
      }

      function updateAnimation() {
        clearInterval(timer);
        if (!reduceMotion && !document.hidden) {
          timer = setInterval(createHeart, 900);
        }
      }
      updateAnimation();
      document.addEventListener("visibilitychange", updateAnimation);

      // A small interactive heart burst when the center heart is clicked.
      loveButton.addEventListener("click", () => {
        if (reduceMotion) return;
        const rect = loveButton.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        for (let i = 0; i < 9; i++) {
          const littleHeart = document.createElement("span");
          const angle = (i / 9) * Math.PI * 2;
          const distance = 42 + Math.random() * 44;
          littleHeart.className = "burst-heart";
          littleHeart.textContent = i % 3 === 0 ? "♡" : "♥";
          littleHeart.style.left = `${x}px`;
          littleHeart.style.top = `${y}px`;
          littleHeart.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
          littleHeart.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
          littleHeart.addEventListener("animationend", () => littleHeart.remove(), { once: true });
          document.body.appendChild(littleHeart);
        }
      });
    })();
  </script>
</body>
</html>
