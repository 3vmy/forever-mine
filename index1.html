<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forever Mine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #0d0d11, #1a0826);

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            color: #fff;
            text-align: center;

            overflow: hidden;
        }

        /* Main Card */
        .card {
            width: min(430px, 90%);
            padding: 40px 25px;

            position: relative;
            z-index: 10;

            background: rgba(255, 255, 255, 0.06);

            /* أخف من backdrop-filter */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);

            animation: fadeIn 1s ease-out;
        }

        /* Initials */
        .initials {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            margin-bottom: 25px;
        }

        .initial {
            font-size: 35px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
        }

        .heart {
            font-size: 45px;
            color: #e63946;

            display: inline-block;

            text-shadow: 0 0 10px rgba(230, 57, 70, 0.5);

            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;

            color: #ff3b5c;

            margin-bottom: 15px;

            letter-spacing: 1px;
            line-height: 1.4;
        }

        hr {
            border: 0;
            height: 1px;

            background: rgba(255, 255, 255, 0.2);

            margin: 20px 0;
        }

        p {
            font-size: 16px;

            color: #f1faee;

            font-style: italic;

            opacity: 0.9;

            line-height: 1.5;
        }

        /* Floating Hearts Container */
        .hearts {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }

        .bg-heart {
            position: absolute;

            bottom: -30px;

            color: rgba(230, 57, 70, 0.18);

            animation: float linear forwards;

            will-change: transform, opacity;
        }

        /* Animations */

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            from {
                transform: translate3d(0, 0, 0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            to {
                transform: translate3d(0, -115vh, 0) rotate(360deg);
                opacity: 0;
            }
        }

        /* Reduce animations for users who prefer less motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts" id="hearts"></div>

    <!-- Main Card -->
    <div class="card">

        <div class="initials">
            <span class="initial" id="firstLetter"></span>

            <span class="heart">❤️</span>

            <span class="initial" id="secondLetter"></span>
        </div>

        <h1>
            "In a world full of variables, you are my only constant."
        </h1>

        <hr>

        <p>
            "Forever & Always, You Belong to Me."
        </p>

    </div>

    <script>
        /*
         * Get letters from URL
         *
         * Example:
         * ?h=H&w=D
         */

        const params = new URLSearchParams(window.location.search);

        const first = document.getElementById("firstLetter");
        const second = document.getElementById("secondLetter");

        const firstLetter = params.get("h") || "";
        const secondLetter = params.get("w") || "";

        first.textContent = firstLetter;
        second.textContent = secondLetter;

        if (!firstLetter) {
            first.style.display = "none";
        }

        if (!secondLetter) {
            second.style.display = "none";
        }


        /*
         * Floating hearts
         */

        const heartsContainer = document.getElementById("hearts");

        function createHeart() {

            const heart = document.createElement("span");

            heart.className = "bg-heart";
            heart.textContent = "♥";

            const size = Math.random() * 12 + 10;
            const left = Math.random() * 100;
            const duration = Math.random() * 3 + 5;

            heart.style.left = `${left}vw`;
            heart.style.fontSize = `${size}px`;
            heart.style.animationDuration = `${duration}s`;

            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        /*
         * 800ms instead of 400ms
         * Less DOM creation = better performance
         */
        setInterval(createHeart, 800);
    </script>

</body>
</html>
